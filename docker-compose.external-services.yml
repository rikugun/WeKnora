# External service profile for this host-local deployment.
#
# Start WeKnora without launching the bundled SearXNG, Neo4j, Qdrant, or MinIO:
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.external-services.yml \
#     --profile external-services up -d
#
# Credentials and endpoint overrides live in .env.local (not committed).
services:
  # Marker service only: Compose profiles attach to services, and this profile
  # exists so the documented command explicitly selects the external setup.
  external-services:
    image: busybox:1.36
    command: ["true"]
    restart: "no"
    profiles:
      - external-services

  app:
    environment:
      RETRIEVE_DRIVER: qdrant
      QDRANT_HOST: ${QDRANT_HOST:-192.168.100.97}
      QDRANT_PORT: ${QDRANT_PORT:-6334}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      NEO4J_ENABLE: ${NEO4J_ENABLE:-true}
      NEO4J_URI: ${NEO4J_URI:-bolt://192.168.100.97:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      STORAGE_TYPE: minio
      # RustFS is S3-compatible and is used through WeKnora's MinIO provider.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-192.168.100.97:9100}
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:-rustfsadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-weknora}
      # SearXNG is configured as a tenant web-search provider in the UI using
      # ${SEARXNG_INSTANCE_URL}; 192.168.100.97 must remain SSRF-whitelisted.
      SSRF_WHITELIST_EXTRA: ${SSRF_WHITELIST_EXTRA:-searxng,qdrant,milvus,weaviate,doris-fe,doris-be,minio,192.168.100.97,*.3y3f3t.com,198.18.0.0/15,192.168.0.0/16}

  langfuse-worker:
    depends_on: {}
    environment:
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_REGION:-auto}
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-rustfsadmin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANGFUSE_S3_INTERNAL_ENDPOINT:-http://192.168.100.97:9100}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${LANGFUSE_S3_REGION:-auto}
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-rustfsadmin}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_MEDIA_ENDPOINT:-http://192.168.100.97:9100}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"

  langfuse-web:
    depends_on: {}
    environment:
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_REGION:-auto}
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-rustfsadmin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANGFUSE_S3_INTERNAL_ENDPOINT:-http://192.168.100.97:9100}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${LANGFUSE_S3_REGION:-auto}
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY_ID:-rustfsadmin}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_ACCESS_KEY:-}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_MEDIA_ENDPOINT:-http://192.168.100.97:9100}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"

  langfuse-minio:
    profiles: !reset [__disabled__]
    ports: !reset []
